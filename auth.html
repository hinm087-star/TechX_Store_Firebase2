<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập | TechX Store</title>
<link rel="stylesheet" href="main.css">
</head>
<body>
<header class="header">
  <a class="logo" href="index.html">TECHX<span>STORE</span></a>
  <a href="index.html">Trang chủ</a>
</header>

<main class="auth-card">
  <div class="eyebrow">TECHNOLOGY STORE</div>
  <h1>Chào mừng bạn!</h1>
  <p class="muted">Đăng nhập để mua sắm tại TechX Store.</p>

  <div class="tabs">
    <button class="tab active" data-show="loginForm">Đăng nhập</button>
    <button class="tab" data-show="registerForm">Đăng ký</button>
  </div>

  <form id="loginForm">
    <label>Email</label>
    <input id="loginEmail" type="email" required autocomplete="email"
           placeholder="Nhập email">

    <label>Mật khẩu</label>
    <input id="loginPassword" type="password" required
           autocomplete="current-password" placeholder="Nhập mật khẩu">

    <button class="btn primary full" type="submit">Đăng nhập</button>
    <button class="text-button" id="forgotPassword" type="button">
      Quên mật khẩu?
    </button>
    <p class="message" id="loginMessage"></p>
  </form>

  <form id="registerForm" class="hidden">
    <label>Họ và tên</label>
    <input id="registerName" required minlength="2" placeholder="Họ tên">

    <label>Email</label>
    <input id="registerEmail" type="email" required placeholder="Email">

    <label>Mật khẩu</label>
    <input id="registerPassword" type="password" required minlength="6"
           placeholder="Ít nhất 6 ký tự">

    <label>Nhập lại mật khẩu</label>
    <input id="registerConfirm" type="password" required minlength="6"
           placeholder="Nhập lại mật khẩu">

    <button class="btn primary full" type="submit">Tạo tài khoản</button>
    <p class="message" id="registerMessage"></p>
  </form>
  <a class="back-link" href="index.html">← Quay lại trang chủ</a>
</main>

<script type="module" src="auth.js"></script>
</body>
</html>
